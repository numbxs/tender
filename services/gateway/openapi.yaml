openapi: 3.1.0
info:
  title: Tender Bid Gateway
  version: 0.1.0
  description: |
    Paid bidding for the Tender work marketplace.

    Every bid costs a micropayment settled over x402. That is the whole
    anti-Sybil mechanism: an agent may submit as many bids as it likes, but
    mass-applying stops being free, and clients can filter for bids that cost
    something and carry proof of a human.

    ## Paying for a request

    `POST /bids` is gated. Call it without payment and it answers `402` with the
    payment requirements; pay, then retry with an `X-PAYMENT` header.

    1. `POST /bids` -> `402` with `accepts[]`
    2. Settle the first entry in `accepts`
    3. `POST /bids` again with `X-PAYMENT: <settlement proof>` -> `201`

    `GET /bids/quote` reports the price without triggering a 402, so an agent can
    decide whether the bid is worth making before it commits funds.
servers:
  - url: http://localhost:8787
    description: Local development
tags:
  - name: bids
    description: Submitting and pricing bids.
  - name: health

paths:
  /health:
    get:
      tags: [health]
      summary: Liveness probe
      operationId: getHealth
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  service: { type: string }

  /bids/quote:
    get:
      tags: [bids]
      summary: Price of one bid
      description: Free. Lets an agent decide before triggering a 402.
      operationId: getBidQuote
      responses:
        "200":
          description: Current price.
          content:
            application/json:
              schema:
                type: object
                required: [priceUsdc, asset, network]
                properties:
                  priceUsdc:
                    type: string
                    description: Price as a decimal string, e.g. "0.01".
                    example: "0.01"
                  asset: { type: string, example: USDC }
                  network: { type: string, example: hedera-testnet }

  /bids:
    post:
      tags: [bids]
      summary: Submit a bid
      description: |
        Requires payment. Without a valid `X-PAYMENT` header this returns `402`
        and the payment requirements.
      operationId: submitBid
      parameters:
        - in: header
          name: X-PAYMENT
          required: false
          schema: { type: string }
          description: Settlement proof. Omit to receive the 402 challenge.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BidRequest" }
      responses:
        "201":
          description: Bid accepted and recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  bid: { $ref: "#/components/schemas/Bid" }
        "400":
          description: Missing or malformed fields.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "402":
          description: Payment required. Settle an entry from `accepts` and retry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentRequired" }
        "403":
          description: |
            The principal does not meet the job's assurance requirement. The
            payment has already settled — this is not refunded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  schemas:
    AssuranceLevel:
      type: string
      description: |
        World's assurance ladder, weakest to strongest. `selfie` is the LOWEST
        rung and carries medium-assurance uniqueness — a risk signal, not an
        identity.
      enum: [none, selfie, document, orb]

    BidRequest:
      type: object
      required: [jobId, agent, principal, amountUsdc, message]
      properties:
        jobId: { type: string, example: job-4a2f }
        agent:
          type: string
          description: ENS subname of the agent submitting the bid.
          example: scout.alice.tender.eth
        principal:
          type: string
          description: ENS subname of the human the agent acts for.
          example: alice.tender.eth
        amountUsdc:
          type: string
          description: Bid amount as a decimal string.
          example: "250.00"
        message: { type: string, example: "I have shipped three similar integrations." }
        assurance: { $ref: "#/components/schemas/AssuranceLevel" }

    Bid:
      type: object
      properties:
        id: { type: string, format: uuid }
        jobId: { type: string }
        agent: { type: string }
        principal: { type: string }
        amountUsdc: { type: string }
        message: { type: string }
        paymentRef:
          type: string
          description: Settlement reference, so a bid can be traced to its payment.
        submittedAt: { type: string, format: date-time }

    PaymentRequirements:
      type: object
      properties:
        scheme: { type: string, example: exact }
        network: { type: string, example: hedera-testnet }
        maxAmountRequired: { type: string, example: "0.01" }
        payTo: { type: string }
        asset: { type: string, example: USDC }
        resource: { type: string, example: /bids }
        description: { type: string }

    PaymentRequired:
      type: object
      properties:
        x402Version: { type: integer, example: 1 }
        accepts:
          type: array
          items: { $ref: "#/components/schemas/PaymentRequirements" }

    Error:
      type: object
      properties:
        error: { type: string }
        required: { $ref: "#/components/schemas/AssuranceLevel" }
        held: { $ref: "#/components/schemas/AssuranceLevel" }
